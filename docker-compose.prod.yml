# Production SaaS Override Stack
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Hardens service exposure by closing direct ports 8000 / 2026 on the host
# and routing all HTTP/HTTPS & WebSocket traffic exclusively through Nginx.

services:
  nginx:
    image: nginx:alpine
    container_name: cosmoquant_nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

  backend:
    ports: !reset []
    environment:
      - ENVIRONMENT=production
      - TRUST_PROXY_HEADERS=true
      - ENABLE_API_DOCS=false
      - ENABLE_METRICS=false

  frontend:
    ports: !reset []
    volumes: !reset []
