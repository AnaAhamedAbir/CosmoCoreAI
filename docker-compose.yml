services:
  # 1. Backend Service (FastAPI)
  backend:
    build: ./backend
    container_name: cosmoquant_backend
    command: bash -c "sed 's/\\r$$//' prestart.sh > /tmp/prestart.sh && bash /tmp/prestart.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 65"
    restart: always
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"  # Localhost-only; never expose raw backend port publicly on VPS
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONUNBUFFERED=1
      - NUMBA_CACHE_DIR=/tmp
      - PYTHONWARNINGS=ignore
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - NUMBA_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
    depends_on:
      - db
      - redis
    env_file:
      - .env

  # 2a. Celery Worker Default (Light Tasks)
  celery_worker_default:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosmo_celery_worker_default
    command: celery -A app.core.celery_app worker -Q celery --loglevel=warning --concurrency=2 --max-tasks-per-child=50 --max-memory-per-child=200000
    volumes:
      - ./backend:/app
      # NOTE: /var/run/docker.sock intentionally NOT mounted — mounting the Docker socket
      # inside a worker allows container escape to full VPS host root access.
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONWARNINGS=ignore
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - NUMBA_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
    restart: always

  # 2b. Celery Worker Heavy (Backtest & ML)
  celery_worker_heavy:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosmo_celery_worker_heavy
    command: celery -A app.core.celery_app worker -Q heavy --loglevel=warning --concurrency=1 --max-tasks-per-child=1
    volumes:
      - ./backend:/app
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONWARNINGS=ignore
      - OMP_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - NUMBA_NUM_THREADS=1
      - MALLOC_ARENA_MAX=2
    restart: always

  # 2b. Celery Beat (Scheduler) - NEW
  celery_beat:
    build: ./backend
    container_name: cosmo_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=warning
    volumes:
      - ./backend:/app
    security_opt:
      - no-new-privileges:true
    depends_on:
      - redis
      - db
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONWARNINGS=ignore
      - MALLOC_ARENA_MAX=2
    restart: always

  # 2c. Telegram Master Bot Listener - NEW
  telegram_bot:
    build: ./backend
    container_name: cosmo_telegram_bot
    command: python scripts/telegram_master_bot.py
    volumes:
      - ./backend:/app
    security_opt:
      - no-new-privileges:true
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MALLOC_ARENA_MAX=2
    restart: always

  # 3. Redis Service - NEW
  redis:
    image: redis:7-alpine
    container_name: cosmoquant_redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    expose:
      - "6379"  # Internal only — NOT exposed to the public internet

  # 4. Frontend Service
  frontend:
    build: ./frontend
    container_name: cosmoquant_frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "2026:2026"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
      - INTERNAL_BACKEND_URL=http://backend:8000

  # 5. Database Service
  db:
    image: timescale/timescaledb-ha:pg16
    container_name: cosmoquant_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosmouser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-cosmoquant_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data

volumes:
  postgres_data:
