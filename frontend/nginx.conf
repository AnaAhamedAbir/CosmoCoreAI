server {
    listen 2026;
    server_name localhost;
    client_max_body_size 5000M;

    # Resolve Docker service DNS dynamically so Nginx boots even if backend is still starting
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Disable continuous access logs to keep terminal clean
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Enable gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Root directory and index file
    root /usr/share/nginx/html;
    index index.html index.htm;

    # PWA Service Worker & Manifest - never cache
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
    location = /manifest.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # React Router handling - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        
        # Prevent caching of index.html so browser always gets the latest JS bundle
        if ($uri = '/index.html') {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires 0;
        }
    }

    # Proxy API and WebSockets requests to backend
    location /api {
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts for WebSockets and long-running APIs
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Explicit WebSocket path
    location /ws {
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static assets proxy
    location /static {
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
